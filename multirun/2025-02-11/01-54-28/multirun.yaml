hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task: []
  job:
    name: train
    chdir: null
    override_dirname: ''
    id: ???
    num: ???
    config_name: train.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/wangqy/Documents/python_test
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/wangqy/Documents/python_test/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      experiment: train/GFP-hard-unsmoothed
      global_paths: default.yaml
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
task_name: ${experiment.task_name}
data:
  task: ${task_name}
  batch_size: 1024
  num_workers: 8
  seed: 420
  alphabet: ARNDCQEGHILKMFPSTWYV
  sequence_column: sequence
  weighted_sampling: true
model:
  mtl:
    n_tokens: 20
    kernel_size": 5
    input_size: 256
    dropout: 0.1
    make_one_hot: true
    activation: relu
    linear: true
    num_tasks: 3
    num_experts: 5
    expert_hidden_units:
    - - 128
      - 64
    gate_hidden_units:
    - - 64
    tower_hidden_units:
    - - 64
      - 64
    hidden_activations: relu
    net_dropout: 0.1
    batch_norm: false
    learning_rate: 0.001
  optimizer:
    lr: 0.001
    weight_decay: 0.0001
callbacks:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  dirpath: ${global_paths.root_dir}/ckpt/${data.task}
  filename: epoch_{epoch:03d}
  monitor: train_sr
  mode: max
  save_top_k: 1
  save_last: true
trainer:
  max_epochs: 100
  accelerator: gpu
  log_every_n_steps: 1
global_paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: ${global_paths.root_dir}/data/
experiment:
  seq_len: 237
  task_name: GFP
  gfp:
    csv_path: ${global_paths.data_dir}/GFP/ground_truth.csv
    task_dir: ${global_paths.data_dir}/GFP
    filter_percentile:
    - - 0.0
      - 0.3
    min_mutant_dist: 7
    top_quantile: 0.99
    pin_memory: true
    smoothing_params: unsmoothed
