task_name: ${experiment.task_name}
data:
  task: ${task_name}
  batch_size: 1024
  num_workers: 8
  seed: 420
  alphabet: ARNDCQEGHILKMFPSTWYV
  sequence_column: sequence
  weighted_sampling: true
model:
  mtl:
    n_tokens: 20
    kernel_size: 3
    input_size: 256
    dropout: 0.1
    make_one_hot: true
    activation: relu
    linear: true
    num_tasks: 3
    num_experts: 5
    expert_hidden_units:
    - 256
    - 128
    gate_hidden_units:
    - 64
    tower_hidden_units:
    - 64
    - 64
    hidden_activations: relu
    net_dropout: 0.1
    batch_norm: false
    learning_rate: 0.0005
  optimizer:
    lr: 0.001
    weight_decay: 0.0001
callbacks:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  dirpath: ${global_paths.root_dir}/ckpt/${data.task}
  filename: epoch_{epoch:03d}
  monitor: train_loss
  mode: min
  save_top_k: 1
  save_last: true
  save_on_train_epoch_end: true
trainer:
  max_epochs: 10
  accelerator: gpu
  log_every_n_steps: 1
global_paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: ${global_paths.root_dir}/data/
experiment:
  seq_len: 237
  task_name: GFP
  gfp:
    csv_path: ${global_paths.data_dir}/GFP/ground_truth.csv
    task_dir: ${global_paths.data_dir}/GFP
    filter_percentile:
    - 0.0
    - 0.3
    min_mutant_dist: 7
    top_quantile: 0.99
    pin_memory: true
    smoothing_params: unsmoothed
